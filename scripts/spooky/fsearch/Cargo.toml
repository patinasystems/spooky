[package]
name = "spooky-fsearch"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fsearch = { path = ".upstream" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# rustc 1.97's Mach-O stripper can misalign proc-macro LINKEDIT on macOS27.
# Keep Apple's linker output intact; app signing runs after the helper is copied.
strip = false
